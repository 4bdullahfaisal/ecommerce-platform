apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ecommerce
resources: [../../base]
images:
  - name: ghcr.io/example/ecommerce-backend
    newName: ghcr.io/example/ecommerce-backend
    newTag: production
  - name: ghcr.io/example/ecommerce-frontend
    newName: ghcr.io/example/ecommerce-frontend
    newTag: production
patches:
  - target: { kind: Deployment, name: backend }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
  - target: { kind: Deployment, name: frontend }
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
